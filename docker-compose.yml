version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tgph
      POSTGRES_USER: tgph
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"

  api:
    build: ./apps/api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tgph:${DB_PASSWORD}@postgres:5432/tgph
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
    depends_on:
      - postgres

  web:
    build: ./apps/web
    ports:
      - "8080:80"
